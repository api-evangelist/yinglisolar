description: >-
  Yingli Energy Development Co., Ltd. (Yingli Solar) is one of the earliest companies in China to
  commit to the photovoltaic industry, operating as an integrated photovoltaic smart-energy solution
  provider spanning technology research and development, smart manufacturing of high-efficiency solar
  PV modules (PANDA 3.0 and YLM 3.0 series), and the development, construction, and operation of power
  stations for residential, commercial, and utility-scale applications. The company was surfaced as a
  portfolio company of balderton-capital and added to the API Evangelist network. As a solar-hardware
  manufacturer, Yingli publishes no public developer API, SDK, or developer portal; its only online
  service surfaces are a product anti-counterfeiting verification tool and product-specification
  downloads.
